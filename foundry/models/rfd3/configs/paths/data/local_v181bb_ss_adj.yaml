# Local paths for this cluster (v181bb / NHR@FAU).
#
# /home/atuin is archive-tier storage, not mounted on compute nodes -- unusable
# for training. The PDB mirror (255K individual .cif.gz files) also can't be
# copied file-by-file onto /hnvme, which has a per-user inode quota nowhere
# near large enough (81920/102400 files, vs 255K+ needed). Instead the mirror
# is packed into a single tar on hnvme (a handful of inodes) and read via
# TarBackedPNUnitsDFParser/TarBackedInterfacesDFParser (atomworks.ml.datasets.
# parsers.tar_backed_row_parsers), using an offset index built by
# scripts/build_pdb_mirror_tar_index.py. See ss_adj_phase3_local.yaml for the
# dataset_parser override that wires this in.
#
# Metadata parquets (small, few files) are read directly from the existing
# copy in the triad_data hnvme workspace -- same schema, verified directly.
#
# No curated SS/ADJ loop dataset is mirrored locally (that lived only on the
# original /work/gerstung filesystem). ss_adj_loop_metadata/val are left null;
# any experiment using this paths config must set datasets.train.loop=null and
# datasets.val=null (standard-only training, no loop bucket, no validation).

pdb_data_dir: null  # unused: dataset_parser is overridden to the tar-backed reader
pdb_parquet_dir: /hnvme/workspace/v181bb10-triad_data/data/metadata/splits

pdb_mirror_tar_path: /hnvme/workspace/v181bb10-rfd3_ssadj_test/pdb_mirror.tar
pdb_mirror_tar_index_path: /hnvme/workspace/v181bb10-rfd3_ssadj_test/pdb_mirror_tar_index.parquet

monomer_distillation_data_dir: null
monomer_distillation_parquet_dir: null
design_benchmark_data_dir: null
design_model_weight_dir: null
residue_cache_dir: null

cif_cache_dir: /home/hpc/v181bb/v181bb10/Protein_Design_Models/RFD3_checkpoints/ss_adj_phase3_local/cif_cache
failed_examples_dir: /home/hpc/v181bb/v181bb10/Protein_Design_Models/RFD3_checkpoints/ss_adj_phase3_local/failed_examples

ss_adj_loop_metadata: null
ss_adj_loop_val_metadata: null
ss_adj_pn_units_train_metadata: /hnvme/workspace/v181bb10-triad_data/data/metadata/splits/pn_units_df_train.parquet
ss_adj_interfaces_train_metadata: /hnvme/workspace/v181bb10-triad_data/data/metadata/splits/interfaces_df_train.parquet

# Adjacency-focused validation splits, stratified by interface type so ligand and
# nucleic-acid conditioning can be scored separately from protein-protein.
# Built from interfaces_df_val.parquet (one row per cluster, capped) by
# docs/motif_adjacency_wiring.md section 16.
ss_adj_val_protein_protein_metadata: /hnvme/workspace/v181bb10-triad_data/data/metadata/splits/ss_adj_val/interfaces_val_protein_protein.parquet
ss_adj_val_protein_ligand_metadata: /hnvme/workspace/v181bb10-triad_data/data/metadata/splits/ss_adj_val/interfaces_val_protein_ligand.parquet
ss_adj_val_protein_na_metadata: /hnvme/workspace/v181bb10-triad_data/data/metadata/splits/ss_adj_val/interfaces_val_protein_na.parquet

# Antibody-containing protein-protein interfaces, identified by Ig FR4 framework
# motif (WGxGT / FGxGT) on a 95-140aa domain in the pn_units sequences, then
# cross-referenced by pdb_id. 141,639 rows / 1,918 clusters -- only 0.55% of all
# clusters, which is their true weight under cluster-based sampling.
ss_adj_antibody_train_metadata: /hnvme/workspace/v181bb10-triad_data/data/metadata/splits/ss_adj_antibody/interfaces_train_antibody.parquet

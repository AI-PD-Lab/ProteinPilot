# @package _global_
# Phase 8: fix the EXTERNAL (target<->binder) adjacency gap, continuing from epoch-0704.
#
# The diagnosis, measured rather than assumed. Internal fold adjacency is solved
# (de novo block recovery 0.960 at epoch 0704); external target<->binder adjacency
# is not, and the benchmark cases that fail are all interface-shaped. The cause is
# exposure, not a labelling bug -- cross-chain adjacency IS supervised (interaction-
# site mode breaks blocks at chain boundaries and treats PPI contacts as first-class
# patches; detach_motif still scores cross-interface pairs, it only stops the
# gradient dragging the pinned target). It is simply rare:
#
#   multi-chain example                     ~45%   (interfaces 40,318 clusters vs
#                                                   pn_units 53,911, cluster-sampled)
#   x ppi condition chosen                   17.4%
#   x CFG mode reveals cross-interface adj   ~60%   (full 20% + interaction-site 40%)
#   x motif region NOT stripped              80%    (motif_region_mask_prob 0.2)
#   -------------------------------------------------------------------------
#   = binder-design-with-cross-interface-adjacency   ~4% of training steps
#
# Internal fold adjacency, by contrast, is present in nearly every conditioned
# example. That ~20x imbalance is the train/inference mismatch: the model is
# excellent at the task it sees constantly and weak at the one it barely sees.
#
# This phase raises that ~4% to roughly ~20% by three independent multipliers, none
# of which touches the label semantics (so nothing already learned is invalidated):
#   1. ppi condition frequency 2.0 -> 5.0 (17.4% -> 35.7% of conditions)
#   2. a dedicated interface-only dataset group at probability 0.30, so multi-chain
#      exposure rises without deleting monomers (which is what de novo folds need)
#   3. motif_region_mask_prob 0.2 -> 0.1: stop deleting the binder<->target
#      adjacency in 1 of 5 motif examples; 0.1 still trains the `ss_adj_contig`
#      inference pattern, which is a real pattern and must not go to zero.
#
# island is also raised (2.0 -> 3.0): it is the training analog of contig motif
# scaffolding, the other half of the reported problem. tipatom comes down 5.0 -> 4.0
# purely to make room -- at 43.5% it was the single largest condition while being
# the least like either failing use case.
#
# Inherits phase 7 unchanged: ss_adj_loop_adj true, ss_adj_typed_blocks true.
#
# Carries everything phase 6 activated (listed below) and adds two changes:
#   * ss_adj_loop_adj: true -- loop-involved pairs become real labels instead of
#     masked. Roughly doubles block count; the biggest label shift of the series.
#   * a mildly upsampled antibody-interface sub-dataset at probability 0.05.
#
# Inherited phase 6 notes follow.
#
# Differences from phase 5, all of which change label or loss semantics -- this is
# an experiment, not a production continuation, and is NOT comparable with the
# 0645->0684 lineage:
#   * ss_adj_mask_loop_pairs: loop/ligand/NA pairs masked (2) instead of asserted
#     non-adjacent (0). RFD1-faithful. Affects ~half of all residues and every
#     ligand/nucleotide.
#   * ss_adj_typed_blocks: molecule-type-aware blocks + heavy-atom contact rules,
#     so ligands and nucleic acids become conditionable at all.
#   * ss_adj_motif_region_mask_prob 0.5 -> 0.2: stop deleting binder<->target
#     adjacency in half the motif examples.
#   * ADJ-only mode now reveals explicit negatives and sometimes the complete
#     matrix (see FeaturizeSSADJ._apply_cfg_dropout).
#   * VALIDATION RE-ENABLED against datasets/val/ss_adj_adjacency, stratified by
#     interface type. Phase 3-5 ran with validate_every_n_epochs=99999 AND
#     datasets.val=null, so nothing in that lineage was ever validated.
#
# Loss flags (use_cb / negative_weight / detach_motif) are set below; turn them on
# one at a time if you want attributable deltas.

#
# Phase 5 (geometry): continues from epoch-0670 with ONE change -- AdjacencyContactLoss
# is now a flat-bottomed well instead of a one-sided attractor. Everything else,
# including the full motif-conditioning mixture, is carried over from Phase 4 unchanged.
#
# Why only one change. epoch-0645, trained WITHOUT the adjacency loss, produces 0.00
# chain breaks and 0.00 CA clashes on the 6-case benchmark; epoch-0670, trained WITH it,
# produces 1.29-2.93 breaks. The model does not need geometry restraints to build clean
# backbones -- it stopped doing so because the loss applied a force with no lower bound:
#   1 - sigmoid((6 - d)/softness)  ->  0.50 at 6.0 A, 0.35 at 4.8, 0.25 at 3.8, 0.12 at 2.0
# i.e. monotonic in d with its optimum at d -> 0. Measured on epoch-0670 designs, the mean
# minimum cross-block distance is 3.81 A, against the ~4.8-5.5 A that paired beta-strands
# actually adopt: contacts compressed a full Angstrom into near-clash range, straining the
# backbone into breaks. Adding continuity/clash losses would treat the symptom; removing
# the force is the fix. If breaks or clashes survive this run, a CA continuity term is the
# next thing to add -- with evidence that it is needed, and only that one.
#
# Usage: same overrides as phase4, with ckpt_config.path=<epoch-0670>.

name: ss-adj-phase7-loop-ab
tags: [ss-adj, finetune, phase5, geometry, contact-well]

defaults:
  # interface_focus is a NEW dataset group, so it needs its own defaults entry --
  # the base ss_adj_design.yaml only wires the interface dataset into
  # train.standard and train.antibody. Without this the group would compose with
  # only the dataset_parser/transform overrides below and no `_target_` or data
  # path, which is exactly how the phase-6 val config failed: hydra instantiates
  # *something*, the name even logs correctly, and it silently yields nothing.
  - /datasets/train/pdb/ss_adj_standard_interface@datasets.train.interface_focus.sub_datasets.interface
  - /trainer/loss/losses/adjacency_contact_loss@trainer.loss.adjacency_contact_loss
  # Adjacency-focused validation, stratified by interface type. Replaces the
  # ss_adj_loop val entry, whose metadata path resolves to null -- which is the
  # real reason phases 3-5 never validated, beyond the run script's datasets.val=null.
  - _self_

ckpt_config:
  _target_: foundry.utils.weights.CheckpointConfig
  path: ???
  reset_optimizer: true
  weight_loading_config:
    _target_: foundry.utils.weights.WeightLoadingConfig
    default_policy: copy
    fallback_policy: reinit
  parameter_freezing_config:
    _target_: foundry.utils.weights.ParameterFreezingConfig
    freeze_by_default: false
    param_policies:
      "shadow.*": true

trainer:
  # --- phase 6: activate the implemented loss machinery -----------------------
  loss:
    adjacency_contact_loss:
      # Score the atom the label is actually defined on
      # (real predicted CB -> virtual CB for glycine -> CA).
      use_cb: true
      # Keep explicitly non-adjacent blocks apart. Native-matched floor, so a loop
      # or ligand that natively touches is not shoved away.
      negative_weight: 0.5
      # Move the binder to the pinned target, not the target to the binder.
      detach_motif: true
      # STERIC ARM for internal motifs. A masked (2) adjacency pair means "adjacency
      # unspecified", NOT "overlap permitted" -- the two are orthogonal. The
      # attractive well guards only revealed 1s and the repulsive arm only revealed
      # 0s, so a masked designed<->motif pair had no distance constraint in this loss
      # at all. The diffusion loss against native coordinates does teach clash-free
      # geometry, so this is hardening rather than the sole defence; it matters at
      # inference, where the motif is pinned at coordinates the scaffold never saw
      # along its own trajectory, which is where interpenetration actually appears.
      #
      # Native-matched: floor = min(steric_floor, native - margin), so a residue that
      # natively packs at 3.8 A is never pushed out to 3.5+margin. Zero on any
      # clash-free structure, so it fires only on genuinely bad predictions.
      steric_weight: 0.5
      steric_floor: 3.5
      steric_margin: 0.5
  # max_epochs is an ABSOLUTE target epoch (matches every ss_adj_phase*.yaml's
  # convention) -- epoch-0651.ckpt's current_epoch is 651, so this must be
  # 651 + (desired new epochs), not just the desired new epoch count.
  max_epochs: 725  # 704 + ~20
  n_examples_per_epoch: 9600
  # Validation DISABLED. The stratified adjacency val set works (399/289/400
  # examples, real examples pull through) but it cost two runs to get there and is
  # not worth further wall-clock right now. The config is left intact -- set this
  # back to 1 to re-enable, nothing else needs changing.
  validate_every_n_epochs: 99999
  checkpoint_every_n_epochs: 1
  grad_accum_steps: 1
  find_unused_parameters: false

datasets:
  # No val group. Validation is disabled, and leaving a val entry in the config
  # means the inference engine reads it out of the checkpoint
  # (next(iter(cfg.datasets.val.items()))) -- a null first entry there made
  # epoch-0694 produce ZERO designs across an entire benchmark. With no val group
  # the engine falls back to the train transform, which is what phase 5 does.
  val: null
  # --- crop size: match STOCK RFD3 design training ----------------------------
  # ss_adj_design.yaml has trained at crop_size 256 since commit 00ea832, but stock
  # RFD3's design dataset (configs/datasets/design_base.yaml) uses 384 -- 256 is the
  # PRETRAIN value. We inherited the wrong one for a design fine-tune.
  #
  # Measured consequence, epoch-0709, 3PTB, same interface patch and same 70-mer
  # binder, varying ONLY target length:
  #     target  tokens   x-chain recovery   CA clashes
  #       80     150         0.688            0.000
  #      140     210         0.500            0.000
  #      200     270         0.438            3.062     <- past 256
  #      223     293         0.312            4.188     <- past 256
  # Recovery decays with size throughout, but clashes are exactly zero inside the
  # crop and appear immediately outside it. Real targets (PD-L1, insulin receptor,
  # IL10RB) are 200-300+ residues, so with a binder they sit beyond anything this
  # lineage has trained on.
  #
  # max_atoms_in_crop follows stock's "~10x crop size" rule. NOTE: the pair
  # representation is quadratic in tokens, so this is ~2.25x the Z memory of 256 --
  # if it OOMs, drop diffusion_batch_size_train before reducing crop_size back.
  crop_size: 384
  max_atoms_in_crop: 3840
  # --- phase 6: molecule-type-aware adjacency (ligands / nucleic acids) --------
  # One toggle; train sub-datasets and the val set both interpolate it.
  ss_adj_typed_blocks: true
  # Loop adjacency ON. Loop-involved block pairs become real 0/1 labels instead of
  # masked, which roughly doubles block count and shifts the label distribution
  # substantially -- hence its own phase rather than folding into phase 6.
  #
  # Safe only because the repulsive arm is native-matched: a loop that natively
  # packs at 4 A gets a ~3 A floor, not the 8 A ceiling. Never enable loop
  # adjacency together with a fixed-threshold repulsive term.
  ss_adj_loop_adj: true
  # Restore the production train_conditions mixture from
  # configs/experiment/pretrain.yaml ("the ratios used in the preprint"),
  # which no local stage (ss_ratio_finetune or any ss_adj_phase*) ever applied.
  # island/tipatom are real-fixed-atom conditioning -- the training-time analog
  # of `input`+`contig` motif-scaffolding at inference (same annotations:
  # is_motif_token / is_motif_atom_with_fixed_coord). Unlike pretrain.yaml
  # (which leaves ppi=0.0, treating PPI/binder-design as a separate finetune),
  # ppi is given nonzero weight here -- our actual use case (scaffolding around
  # a real target) is exactly the PPI/binder-design task shape, so it should be
  # represented directly in this recovery mixture rather than deferred.
  global_transform_args:
    train_conditions:
      unconditional:
        # RAISED 2.0 -> 3.0, not lowered. `unconditional` on a MULTI-CHAIN example is
        # the only condition that produces a FULLY DE NOVO interface: is_motif_token
        # is all False, so both chains are diffused and nothing but adjacency
        # describes the interface -- no fixed target, no hotspots. Trimming it to
        # make room for ppi took that case from 7.8% of steps to 5.9%, i.e. BELOW
        # where epoch 0704 already was, which is the opposite of the intent.
        # At 3.0 it is 10.9% while ppi still holds 41%.
        frequency: 3.0
      island:
        # INTERNAL MOTIFS. island fixes islands of real atoms INSIDE the designed
        # chain -- the "motif embedded in the generated protein" case, as opposed to
        # ppi's separate fixed target. Raised 2.0 -> 4.0 (17.4% -> 22.2%). The clashes
        # reported for this case are addressed mainly by the mask_prob change below:
        # a masked motif<->designed pair carries NO repulsive signal, so nothing in
        # the objective keeps the growing scaffold out of the motif's volume.
        frequency: 4.0
      sequence_design:
        frequency: 0.5
      tipatom:
        frequency: 4.0
      ppi:
        # BINDERS, heavily upweighted: 2.0 -> 8.0, i.e. 17.4% -> 44.4% of conditions
        # and now the single largest. Binder-against-fixed-target is the primary
        # failing use case and was previously outweighted 2.5:1 by tipatom.
        frequency: 8.0
        # Admit protein<->nucleic-acid interfaces with the NA as the fixed target.
        # Previously PPICondition required BOTH pn_units to be protein, so protein-NA
        # was rejected outright and "design a protein against fixed DNA/RNA" was
        # never trained in the binder shape -- which is why NA non-contact never
        # improved (violation 0.812 -> 0.875 across epochs 684 -> 704) while
        # protein-protein did. The binder is still always drawn from the protein
        # units; NA is target-only, and NA<->NA remains rejected.
        allow_na_target: true
  train:
    # Group probabilities. `interface_focus` is the same interfaces dataset as
    # standard.sub_datasets.interface, promoted to its own group so multi-chain
    # exposure can be raised WITHOUT deleting monomers -- de novo internal folds
    # (block recovery 0.960) are the one thing that already works and they need
    # pn_units to stay in the mix. Net multi-chain share goes ~45% -> ~72%.
    standard:
      probability: 0.50
      sub_datasets:
        pn_unit:
          dataset:
            dataset_parser:
              _target_: atomworks.ml.datasets.parsers.TarBackedPNUnitsDFParser
              tar_path: ${paths.data.pdb_mirror_tar_path}
              index_path: ${paths.data.pdb_mirror_tar_index_path}
            transform:
              # 0.2 -> 0.1: stop deleting binder<->target adjacency in 1 of every 5
              # motif examples. Not 0.0 -- the stripped pattern IS a real inference
              # call (`ss_adj_contig`), so it must stay represented, just rarer.
              ss_adj_motif_region_mask_prob: 0.05
              # UPSAMPLE INTERCHAIN ADJACENCY directly. interaction-site mode grows a
              # patch outward from a seed pair, so the seed is always in the revealed
              # patch. Seeding was uniform over contact pairs and therefore
              # chain-blind -- and since intra-chain contacting pairs outnumber
              # inter-chain ones several-fold, the interface was revealed only when
              # uniform sampling happened to land on it. 0.7 seeds from a cross-chain
              # pair when one exists; the remaining 0.3 keeps intra-chain fold
              # conditioning on multi-chain examples, which is also a real inference
              # pattern and is what de novo folds (the part already working) need.
              ss_adj_cross_chain_seed_prob: 0.7
              # THE binder/multimer inference pattern, previously untrained: target SS
              # masked, binder SS specified, cross-chain adjacency SPECIFIED. 0.35 of
              # motif-bearing examples. Distinct from the 0.05 full-mask below, which
              # is the ss_adj_contig pattern (target SS *and* adjacency stripped).
              ss_adj_motif_ss_only_mask_prob: 0.35
        interface:
          dataset:
            dataset_parser:
              _target_: atomworks.ml.datasets.parsers.TarBackedInterfacesDFParser
              tar_path: ${paths.data.pdb_mirror_tar_path}
              index_path: ${paths.data.pdb_mirror_tar_index_path}
            transform:
              ss_adj_motif_region_mask_prob: 0.05
              # UPSAMPLE INTERCHAIN ADJACENCY directly. interaction-site mode grows a
              # patch outward from a seed pair, so the seed is always in the revealed
              # patch. Seeding was uniform over contact pairs and therefore
              # chain-blind -- and since intra-chain contacting pairs outnumber
              # inter-chain ones several-fold, the interface was revealed only when
              # uniform sampling happened to land on it. 0.7 seeds from a cross-chain
              # pair when one exists; the remaining 0.3 keeps intra-chain fold
              # conditioning on multi-chain examples, which is also a real inference
              # pattern and is what de novo folds (the part already working) need.
              ss_adj_cross_chain_seed_prob: 0.7
              # THE binder/multimer inference pattern, previously untrained: target SS
              # masked, binder SS specified, cross-chain adjacency SPECIFIED. 0.35 of
              # motif-bearing examples. Distinct from the 0.05 full-mask below, which
              # is the ss_adj_contig pattern (target SS *and* adjacency stripped).
              ss_adj_motif_ss_only_mask_prob: 0.35
    interface_focus:
      probability: 0.40
      sub_datasets:
        interface:
          dataset:
            dataset_parser:
              _target_: atomworks.ml.datasets.parsers.TarBackedInterfacesDFParser
              tar_path: ${paths.data.pdb_mirror_tar_path}
              index_path: ${paths.data.pdb_mirror_tar_index_path}
            transform:
              ss_adj_motif_region_mask_prob: 0.05
              # UPSAMPLE INTERCHAIN ADJACENCY directly. interaction-site mode grows a
              # patch outward from a seed pair, so the seed is always in the revealed
              # patch. Seeding was uniform over contact pairs and therefore
              # chain-blind -- and since intra-chain contacting pairs outnumber
              # inter-chain ones several-fold, the interface was revealed only when
              # uniform sampling happened to land on it. 0.7 seeds from a cross-chain
              # pair when one exists; the remaining 0.3 keeps intra-chain fold
              # conditioning on multi-chain examples, which is also a real inference
              # pattern and is what de novo folds (the part already working) need.
              ss_adj_cross_chain_seed_prob: 0.7
              # THE binder/multimer inference pattern, previously untrained: target SS
              # masked, binder SS specified, cross-chain adjacency SPECIFIED. 0.35 of
              # motif-bearing examples. Distinct from the 0.05 full-mask below, which
              # is the ss_adj_contig pattern (target SS *and* adjacency stripped).
              ss_adj_motif_ss_only_mask_prob: 0.35
    antibody:
      probability: 0.10
      sub_datasets:
        interface:
          dataset:
            transform:
              ss_adj_motif_region_mask_prob: 0.05
              # UPSAMPLE INTERCHAIN ADJACENCY directly. interaction-site mode grows a
              # patch outward from a seed pair, so the seed is always in the revealed
              # patch. Seeding was uniform over contact pairs and therefore
              # chain-blind -- and since intra-chain contacting pairs outnumber
              # inter-chain ones several-fold, the interface was revealed only when
              # uniform sampling happened to land on it. 0.7 seeds from a cross-chain
              # pair when one exists; the remaining 0.3 keeps intra-chain fold
              # conditioning on multi-chain examples, which is also a real inference
              # pattern and is what de novo folds (the part already working) need.
              ss_adj_cross_chain_seed_prob: 0.7
              # THE binder/multimer inference pattern, previously untrained: target SS
              # masked, binder SS specified, cross-chain adjacency SPECIFIED. 0.35 of
              # motif-bearing examples. Distinct from the 0.05 full-mask below, which
              # is the ss_adj_contig pattern (target SS *and* adjacency stripped).
              ss_adj_motif_ss_only_mask_prob: 0.35

model:
  net:
    token_initializer:
      ss_adapter:
        enabled: true
      adj_adapter:
        enabled: true
    inference_sampler:
      cfg_features:
        - ref_atomwise_rasa
        - active_donor
        - active_acceptor
        - ss_ratio
        - ss_labels
        - adj_matrix
  optimizer:
    _target_: torch.optim.Adam
    lr: 2.0e-6
    betas: [0.9, 0.95]
    eps: 1.0e-8
  lr_scheduler:
    _target_: foundry.training.schedulers.AF3Scheduler
    base_lr: 2.0e-6
    warmup_steps: 250
    decay_factor: 0.95
    decay_steps: 6000

# Validation dataloader: allow fallback retries.
#
# dataloader/default.yaml sets n_fallback_retries=0 for val ("Disable fallback
# retries for validation") vs 20 for train. That is safe for the curated upstream
# val sets, which never fail transforms. These splits are drawn from raw interface
# rows, and a few percent hit the same benign per-example failure seen ~1.7x per
# logged batch during training:
#     AssertionError: Transforms failed at `ConditionalRoute -> CropSpatialLikeAF3`:
#     No crop center found!
# In training that example is resampled; in validation it killed a 6.5 h run.
#
# Tradeoff accepted knowingly: retries make the val set non-deterministic at the
# margin (a failing example is replaced by another). Validation here is an average
# over ~100 batches per split, so a handful of substitutions is immaterial, whereas
# a crash costs an epoch. The deterministic alternative -- pre-filtering the splits
# by actually running the pipeline over all 1088 examples -- costs hours of I/O.
dataloader:
  val:
    n_fallback_retries: 20

# Mild antibody upsampling. Antibody-containing protein-protein interfaces are only
# 0.55% of clusters (their true weight under cluster sampling, despite 2.12% of raw
# rows). 0.05 here takes them to roughly 5% -- a ~9x boost, but still a minority so
# the general distribution is not distorted.
#
# Identification is heuristic (Ig FR4 motif on a 95-140aa domain, cross-referenced
# by pdb_id); there is no antibody annotation in the manifest. Expect some misses
# and some Ig-fold false positives.

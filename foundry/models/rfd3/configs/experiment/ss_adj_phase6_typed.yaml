# @package _global_
# Phase 6: activate everything implemented after phase 5 and MEASURE it.
#
# Differences from phase 5, all of which change label or loss semantics -- this is
# an experiment, not a production continuation, and is NOT comparable with the
# 0645->0684 lineage:
#   * ss_adj_mask_loop_pairs: loop/ligand/NA pairs masked (2) instead of asserted
#     non-adjacent (0). RFD1-faithful. Affects ~half of all residues and every
#     ligand/nucleotide.
#   * ss_adj_typed_blocks: molecule-type-aware blocks + heavy-atom contact rules,
#     so ligands and nucleic acids become conditionable at all.
#   * ss_adj_motif_region_mask_prob 0.5 -> 0.2: stop deleting binder<->target
#     adjacency in half the motif examples.
#   * ADJ-only mode now reveals explicit negatives and sometimes the complete
#     matrix (see FeaturizeSSADJ._apply_cfg_dropout).
#   * VALIDATION RE-ENABLED against datasets/val/ss_adj_adjacency, stratified by
#     interface type. Phase 3-5 ran with validate_every_n_epochs=99999 AND
#     datasets.val=null, so nothing in that lineage was ever validated.
#
# Loss flags (use_cb / negative_weight / detach_motif) are set below; turn them on
# one at a time if you want attributable deltas.

#
# Phase 5 (geometry): continues from epoch-0670 with ONE change -- AdjacencyContactLoss
# is now a flat-bottomed well instead of a one-sided attractor. Everything else,
# including the full motif-conditioning mixture, is carried over from Phase 4 unchanged.
#
# Why only one change. epoch-0645, trained WITHOUT the adjacency loss, produces 0.00
# chain breaks and 0.00 CA clashes on the 6-case benchmark; epoch-0670, trained WITH it,
# produces 1.29-2.93 breaks. The model does not need geometry restraints to build clean
# backbones -- it stopped doing so because the loss applied a force with no lower bound:
#   1 - sigmoid((6 - d)/softness)  ->  0.50 at 6.0 A, 0.35 at 4.8, 0.25 at 3.8, 0.12 at 2.0
# i.e. monotonic in d with its optimum at d -> 0. Measured on epoch-0670 designs, the mean
# minimum cross-block distance is 3.81 A, against the ~4.8-5.5 A that paired beta-strands
# actually adopt: contacts compressed a full Angstrom into near-clash range, straining the
# backbone into breaks. Adding continuity/clash losses would treat the symptom; removing
# the force is the fix. If breaks or clashes survive this run, a CA continuity term is the
# next thing to add -- with evidence that it is needed, and only that one.
#
# Usage: same overrides as phase4, with ckpt_config.path=<epoch-0670>.

name: ss-adj-phase6-typed
tags: [ss-adj, finetune, phase5, geometry, contact-well]

defaults:
  - /trainer/loss/losses/adjacency_contact_loss@trainer.loss.adjacency_contact_loss
  # Adjacency-focused validation, stratified by interface type. Replaces the
  # ss_adj_loop val entry, whose metadata path resolves to null -- which is the
  # real reason phases 3-5 never validated, beyond the run script's datasets.val=null.
  - _self_

ckpt_config:
  _target_: foundry.utils.weights.CheckpointConfig
  path: ???
  reset_optimizer: true
  weight_loading_config:
    _target_: foundry.utils.weights.WeightLoadingConfig
    default_policy: copy
    fallback_policy: reinit
  parameter_freezing_config:
    _target_: foundry.utils.weights.ParameterFreezingConfig
    freeze_by_default: false
    param_policies:
      "shadow.*": true

trainer:
  # --- phase 6: activate the implemented loss machinery -----------------------
  loss:
    adjacency_contact_loss:
      # Score the atom the label is actually defined on
      # (real predicted CB -> virtual CB for glycine -> CA).
      use_cb: true
      # Keep explicitly non-adjacent blocks apart. Native-matched floor, so a loop
      # or ligand that natively touches is not shoved away.
      negative_weight: 0.5
      # Move the binder to the pinned target, not the target to the binder.
      detach_motif: true
  # max_epochs is an ABSOLUTE target epoch (matches every ss_adj_phase*.yaml's
  # convention) -- epoch-0651.ckpt's current_epoch is 651, so this must be
  # 651 + (desired new epochs), not just the desired new epoch count.
  max_epochs: 695  # 684 + ~10
  n_examples_per_epoch: 9600
  # Validation DISABLED. The stratified adjacency val set works (399/289/400
  # examples, real examples pull through) but it cost two runs to get there and is
  # not worth further wall-clock right now. The config is left intact -- set this
  # back to 1 to re-enable, nothing else needs changing.
  validate_every_n_epochs: 99999
  checkpoint_every_n_epochs: 1
  grad_accum_steps: 1
  find_unused_parameters: false

datasets:
  # No val group. Validation is disabled, and leaving a val entry in the config
  # means the inference engine reads it out of the checkpoint
  # (next(iter(cfg.datasets.val.items()))) -- a null first entry there made
  # epoch-0694 produce ZERO designs across an entire benchmark. With no val group
  # the engine falls back to the train transform, which is what phase 5 does.
  val: null
  # --- phase 6: molecule-type-aware adjacency (ligands / nucleic acids) --------
  # One toggle; train sub-datasets and the val set both interpolate it.
  ss_adj_typed_blocks: true
  # Restore the production train_conditions mixture from
  # configs/experiment/pretrain.yaml ("the ratios used in the preprint"),
  # which no local stage (ss_ratio_finetune or any ss_adj_phase*) ever applied.
  # island/tipatom are real-fixed-atom conditioning -- the training-time analog
  # of `input`+`contig` motif-scaffolding at inference (same annotations:
  # is_motif_token / is_motif_atom_with_fixed_coord). Unlike pretrain.yaml
  # (which leaves ppi=0.0, treating PPI/binder-design as a separate finetune),
  # ppi is given nonzero weight here -- our actual use case (scaffolding around
  # a real target) is exactly the PPI/binder-design task shape, so it should be
  # represented directly in this recovery mixture rather than deferred.
  global_transform_args:
    train_conditions:
      unconditional:
        frequency: 2.0
      island:
        frequency: 2.0
      sequence_design:
        frequency: 0.5
      tipatom:
        frequency: 5.0
      ppi:
        frequency: 2.0
  train:
    standard:
      sub_datasets:
        pn_unit:
          dataset:
            dataset_parser:
              _target_: atomworks.ml.datasets.parsers.TarBackedPNUnitsDFParser
              tar_path: ${paths.data.pdb_mirror_tar_path}
              index_path: ${paths.data.pdb_mirror_tar_index_path}
        interface:
          dataset:
            dataset_parser:
              _target_: atomworks.ml.datasets.parsers.TarBackedInterfacesDFParser
              tar_path: ${paths.data.pdb_mirror_tar_path}
              index_path: ${paths.data.pdb_mirror_tar_index_path}

model:
  net:
    token_initializer:
      ss_adapter:
        enabled: true
      adj_adapter:
        enabled: true
    inference_sampler:
      cfg_features:
        - ref_atomwise_rasa
        - active_donor
        - active_acceptor
        - ss_ratio
        - ss_labels
        - adj_matrix
  optimizer:
    _target_: torch.optim.Adam
    lr: 2.0e-6
    betas: [0.9, 0.95]
    eps: 1.0e-8
  lr_scheduler:
    _target_: foundry.training.schedulers.AF3Scheduler
    base_lr: 2.0e-6
    warmup_steps: 250
    decay_factor: 0.95
    decay_steps: 6000

# Validation dataloader: allow fallback retries.
#
# dataloader/default.yaml sets n_fallback_retries=0 for val ("Disable fallback
# retries for validation") vs 20 for train. That is safe for the curated upstream
# val sets, which never fail transforms. These splits are drawn from raw interface
# rows, and a few percent hit the same benign per-example failure seen ~1.7x per
# logged batch during training:
#     AssertionError: Transforms failed at `ConditionalRoute -> CropSpatialLikeAF3`:
#     No crop center found!
# In training that example is resampled; in validation it killed a 6.5 h run.
#
# Tradeoff accepted knowingly: retries make the val set non-deterministic at the
# margin (a failing example is replaced by another). Validation here is an average
# over ~100 batches per split, so a handful of substitutions is immaterial, whereas
# a crash costs an epoch. The deterministic alternative -- pre-filtering the splits
# by actually running the pipeline over all 1088 examples -- costs hours of I/O.
dataloader:
  val:
    n_fallback_retries: 20

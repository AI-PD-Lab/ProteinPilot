defaults:
  - rfd3_train_interface
  - _self_

dataset:
  dataset:
    data: ${paths.data.ss_adj_interfaces_train_metadata}
  transform:
    ss_adj_enabled: true
    ss_adj_loop_adj: ${datasets.ss_adj_loop_adj}
    # Loop/ligand/NA pairs -> 2 (masked) instead of 0. RFD1 masks them
    # (BlockAdjacency.mask_ss_adj); 0 is an ACTIVE learned "not in contact" signal,
    # so the old behaviour asserted non-adjacency for ~half the residues and for
    # every ligand and nucleotide. false = reproduce 0645-0684 label semantics.
    ss_adj_mask_loop_pairs: true
    # Molecule-type-aware blocks + contact rules for ligands / nucleic acids.
    # Ligand block = entity; NA duplex = helical turns spanning BOTH strands, split
    # ds/ss by local base pairing; heavy-atom cutoffs 4.5 A (ligand) / 5.0 A (NA)
    # instead of the protein C-beta 6 A rule.
    ss_adj_typed_blocks: ${datasets.ss_adj_typed_blocks}
    # Fraction of motif-bearing examples whose motif tokens get SS/ADJ stripped.
    # 0.5 deletes binder<->target adjacency in half the examples that teach it.
    ss_adj_motif_region_mask_prob: 0.2
    reject_short_multichain_local_tokens: true

defaults:
  - ss_adj_design
  - train/ss_adj_loop@train.standard
  - train/ss_adj_loop@train.loop
  - _self_

train:
  standard:
    probability: 0.93
    dataset:
      dataset:
        name: ss_adj_standard_smoke
        data: /work/gerstung/RFD3_Training/Data_Mirrors/ss_adj_loop/standard_smoke_dataset.csv
      dataset_parser:
        pn_unit_iid_colnames: null
      transform:
        ss_adj_loop_adj: false
  loop:
    probability: 0.07
    dataset:
      dataset:
        name: ss_adj_loop_smoke
        data: /work/gerstung/RFD3_Training/Data_Mirrors/ss_adj_loop/loop_smoke_dataset.csv
      dataset_parser:
        pn_unit_iid_colnames: null
      transform:
        ss_adj_loop_adj: true

# @package _global_
# Arm A: only the new modules (ring_embed, ring_head_*: 18,839 parameters) train, the released network stays frozen.
# parameter_freezing is honoured on a fresh start from `hf_ckpt_path` only; on resume (last.ckpt) train_entry/s2.glue re-applies it.
arm: A
run_name_: triadr_s2_A
lora:
  r: null
parameter_freezing:
  _target_: rfproteina.utils.weights.ParameterFreezingConfig
  freeze_by_default: true
  param_policies:
    "nn.ring_*": false          # False = not frozen (True would freeze)

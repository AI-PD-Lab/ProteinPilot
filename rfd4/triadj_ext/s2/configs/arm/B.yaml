# @package _global_
# Arm B: A + PEFT LoRA r=32 on the trunk attention (to_qkv, to_out_node; 2.06 M parameters). The new ring_* modules stay trainable:
# rfproteina.utils.lora._inject freezes the whole model, s2.glue / model_s2.install_lora_unfreeze re-enable them after every injection.
# lora + parameter_freezing / weight_loading are forbidden together (train.py:215-220): the base is the strict EXPANDED bundle.
arm: B
run_name_: triadr_s2_B
nn:
  attention_type: torch         # fused attention bypasses adapter forwards (utils/lora.py)
lora:
  r: 32
  lora_alpha: 64.0
  lora_dropout: 0.0
  train_bias: none
  target_modules: [to_qkv, to_out_node]

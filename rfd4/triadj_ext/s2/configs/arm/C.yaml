# @package _global_
# Arm C: B + per-block interaction heads at trunk blocks 4/8/12 with zero-init feedback into z at 4/8 (model_s2.TriadRTransformer). The
# `nn.ring` block (head_blocks, feedback_blocks, feedback_detach) is part of the expanded bundle C written by make_base_bundle, so
# train.py:_adopt_bundle_architecture takes it from the bundle; ablations: hf_bundle_overrides='{nn: {ring: {feedback_detach: false}}}'.
arm: C
run_name_: triadr_s2_C
nn:
  attention_type: torch
lora:
  r: 32
  lora_alpha: 64.0
  lora_dropout: 0.0
  train_bias: none
  target_modules: [to_qkv, to_out_node]

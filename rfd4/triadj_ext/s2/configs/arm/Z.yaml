# @package _global_
# Arm Z (control): B's LoRA, SAME data stream (same rows, same RNG), but the flow matcher forces an all-MASK stream and no ring loss and
# every ring_* parameter is frozen (model_s2.UNFREEZE_PATTERNS_BY_ARM['Z'] = []). Separates "LoRA / K=1 / PDB replay drift" from the stream effect.
arm: Z
run_name_: triadr_s2_Z
nn:
  attention_type: torch
lora:
  r: 32
  lora_alpha: 64.0
  lora_dropout: 0.0
  train_bias: none
  target_modules: [to_qkv, to_out_node]

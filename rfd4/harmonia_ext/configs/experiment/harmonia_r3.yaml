# @package _global_
# HARMONIA R3 = R2 (compactness gate, replay native SS off, same init/data/curriculum/loss) + dense-zero noise on ADJ-only rows too, at p 0.30.
# R2 (N004) at n=128 split 11.7 % (w2) / 7.8 % (w1.5) on the Rossmann dense-zero adj-only arm vs p0694 3.1 %: R2 never saw the dense-zero dialect
# without SS (dense-zero was applied to 'full' rows only), so that arm is out of distribution. Flags are all Rg (elongated), not separated halves.
defaults:
  - /experiment/harmonia_r2
  - _self_

run_name_: harmonia_r3
datasets:
  train:
    harm_pdb:
      dataset:
        p_dense_zero: 0.30
        dense_modes: [adj_only, full]
log:
  tags: [harmonia, rfd4, r3, full, gate_compact, dense_zero_adj]

# @package _global_
# HARMONIA R1, FULL fine-tune of the denoiser (178 M; the autoencoder stays frozen in Proteina.load_autoencoder). Same data / curriculum / loss
# as harmonia_r1 (LoRA control). Reason (user 10-28 + RFD3 history): LoRA adapts only attention to_qkv / to_out_node, the pair track that must
# process a pair-level ADJ map stays frozen; on RFD3 a frozen base was under-conditioned (FR 0.57) and unfreezing gave 0.755+.
defaults:
  - /experiment/harmonia_r1
  - _self_

run_name_: harmonia_r1_full
lora:
  r: null
opt:
  lr: 1.0e-5                 # Muon (hidden matrices) + Adam (embeddings, norms, heads): 10 % of the pretraining lr 1e-4
  new_module_lr_mult: 10.0   # adj_embed + SS embedding at 1e-4
callbacks:
  ema_callback:
    decay: 0.999
log:
  tags: [harmonia, rfd4, r1, full]

# @package _global_
# HARMONIA stage R1 on RFD4-Proteina: SS (RFD4's own C_SEC channel) + block adjacency (zero-init adj_embed into z0, 6 states incl.
# HOT/COLD) fine-tune of the released weights with LoRA r=32 on the trunk attention. Plain RFD4 flow loss: no auxiliary contact loss
# (RFD3 lesson: A0 == A1, and the old contact loss's expansion bias caused the splitting), no guided/CFG-in-the-loop loss (C3/C4 dead end).
#   python -m harmonia_ext.train_entry experiment=harmonia_r1 hf_ckpt_path=/w/harmonia_rfd4/base out_dir=<node-local> ...
defaults:
  - /releases/flow/2026_10_19_hero_pretrain
  - /design_tasks/presets@datasets.train.replay_pdb.dataset.design_tasks: unconditional_pretraining
  - /design_tasks/presets@datasets.val.val_replay.dataset.design_tasks: unconditional_pretraining
  - _self_

run_name_: harmonia_r1

_h_crop:                                    # release crop recipe (0.9-1.0 of the chain, <= 256 tokens, 20 % uncropped)
  path_length_search_cutoff: 64
  crop_size: null
  crop_size_range: ${_crop_size_range}
  max_crop_size: ${_max_tokens}
  p_no_subcrop: ${_p_no_subcrop}
  loss_weight_cfg: ${_loss_weights}

_hero_streaming: null

datasets:
  train:
    afdb_monomer: null
    omol: null
    plinder: null
    pdb_interfaces: null
    ted_dimers: null
    tcr_interfaces_distill: null
    na_complex: null
    rna_monomer: null
    antibody_interfaces_distill: null
    tcr_interfaces_pdb: null
    antibody_interfaces_pdb: null
    cpsea_pdb: null
    cpsea_afdb: null
    pdb_dna_interface: null
    harm_pdb:                               # SS/ADJ curriculum rows (uncond 10 / ss_only 15 / adj_only 15 / full 35 / sparse 25 %)
      probability: 0.6
      weights: {_target_: atomworks.ml.samplers.calculate_weights_by_inverse_cluster_size, cluster_column: cluster}
      dataset:
        _target_: harmonia_ext.adj_data.HarmoniaDataset
        name: harm_pdb
        rows: all
        split: train
        seed: 11
        transform: ${_h_crop}
    replay_pdb:                             # same PDB rows, no SS/ADJ, the release's unconditional-pretraining task mix (replay)
      probability: 0.4
      weights: {_target_: atomworks.ml.samplers.calculate_weights_by_inverse_cluster_size, cluster_column: cluster}
      dataset:
        _target_: triadj_ext.ring_data.RingDataset
        name: replay_pdb
        rows: all
        split: train
        ring_labels: false
        seed: 23
        transform:
          path_length_search_cutoff: 64
          crop_size: null
          crop_size_range: ${_crop_size_range}
          max_crop_size: ${_max_tokens}
          p_no_subcrop: ${_p_no_subcrop}
          loss_weight_cfg: ${_loss_weights}
          centroid_kwargs: {p_add_centroid_condition: 0.2, noise_std_angstrom: 5.0}
  val:
    unconditional: null
    unindexed_motif_scaffold_subset: null
    indexed_motif_scaffold_subset: null
    mcsa_subset: null
    mcsa_subset_fixed_ligand: null
    mcsa_subset_no_ligand: null
    ppi_bb_only_subset_12: null
    dna_binder_structure_context: null
    dna_binder_sequence_context: null
    disco_subset: null
    sequence_bias: null
    rasa_IAI: null
    val_harm_full:                          # same 256 held-out rows (disjoint sequence clusters): full SS+ADJ vs nothing
      dataset:
        _target_: harmonia_ext.adj_data.HarmoniaDataset
        name: val_harm_full
        rows: all
        split: val
        n_val: 256
        forced_mode: full
        seed: 5
        substitute_on_failure: false
        transform: ${_h_crop}
      compute_loss: true
      generate: false
      t_grid: [0.1, 0.3, 0.5, 0.7, 0.9]
    val_harm_uncond:
      dataset:
        _target_: harmonia_ext.adj_data.HarmoniaDataset
        name: val_harm_uncond
        rows: all
        split: val
        n_val: 256
        forced_mode: uncond
        seed: 5
        substitute_on_failure: false
        transform: ${_h_crop}
      compute_loss: true
      generate: false
      t_grid: [0.1, 0.3, 0.5, 0.7, 0.9]
    val_replay:
      dataset:
        _target_: triadj_ext.ring_data.RingDataset
        name: val_replay
        rows: all
        split: val
        n_val: 256
        ring_labels: false
        seed: 5
        substitute_on_failure: false
        transform: ${datasets.train.replay_pdb.dataset.transform}
      compute_loss: true
      generate: false
      t_grid: [0.1, 0.3, 0.5, 0.7, 0.9]

metrics: null

dataloaders:
  batch_size: 8
  num_workers: 12
  prefetch_factor: 4
  val:
    dataloader_params:
      batch_size: 8
      num_workers: 4
      collate_fn:
        _target_: triadj_ext.ring_data.collate_batch_drop_failed

training:
  exploration_k: 1
  exploration_losses: [bb_ca, local_latents]

nn:
  attention_type: torch                     # fused attention bypasses the LoRA adapter forwards
lora:
  r: 32
  lora_alpha: 64.0
  lora_dropout: 0.0
  train_bias: none
  target_modules: [to_qkv, to_out_node]

opt:
  lr: 5.0e-5
  new_module_lr_mult: 10.0                  # adj_embed + SS embedding (Adam group) at 10 x lr
  adam_warmup_steps: 200
  muon_warmup_steps: 200
  gradient_clip_val: 1.0
  accumulate_grad_batches: 2
  steps_per_epoch: 100
  max_epochs: 40
  val_every_n_epochs: 5
  compute_val_loss: true
  num_sanity_val_steps: 2
  muon_exclude_param_patterns:
    - _factory\.
    - ^nn\.(local_latents_linear|ca_linear|insertion_q_proj|insertion_k_proj)\.
    - ^nn\.sequence_readout\.
    - ^nn\.adj_

callbacks:
  ema_callback:
    _target_: triadj_ext.s2.callbacks.TriadSimpleEMA
    decay: 0.998
  epoch_callback:
    _target_: triadj_ext.s2.callbacks.RingSetEpochCallback
  harmonia_log_callback:
    _target_: harmonia_ext.callbacks.HarmoniaLogCallback
    every_n: 10

log:
  log_wandb: false
  checkpoint: true
  checkpoint_every_n_epochs: 10
  last_ckpt_every_n_epochs: 1
  tags: [harmonia, rfd4, r1]

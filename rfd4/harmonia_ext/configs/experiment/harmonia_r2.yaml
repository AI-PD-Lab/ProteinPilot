# @package _global_
# HARMONIA R2 = R1 full fine-tune (same init, data, curriculum, loss, optimiser) + two data changes so that ADJACENCY ALONE implies a compact
# domain (user 10-30: compactness must come from the adjacency, not from extra labels such as CATH):
#   gate_compact: SS / ADJ are revealed only on rows whose protein chains pass the panel's universal split detector (compact domains);
#                 non-compact rows (extended pn_units of complexes, fragments) train the unconditional task instead.
#   p_dense_zero: 15 % of 'full' rows also mark loop / same-block / diagonal pairs NON_CONTACT, so the old dense-zero spec dialect carries
#                 no geometry (Rossmann stress test).
#   replay native SS off: the release's SS modifier (p 0.1) revealed native SS on replay rows without a compactness check (red-team N003 #4);
#                 R2 shows SS only through the gated HARMONIA rows. (Changes the replay task mix vs R1 by ~4 % of rows.)
# val_harm_full uses the same gate; NOTE its loss mixes accepted (conditioned) and rejected (unconditional) rows (red-team N003 #3): a monitor,
# not the test. The test is generation on the panel + the Rossmann dense-zero stress, SS+ADJ only (no CATH).
defaults:
  - /experiment/harmonia_r1_full
  - _self_

run_name_: harmonia_r2
datasets:
  global_design_task_kwargs:
    secondary_structure_kwargs:
      p_add_secondary_structure_condition: 0.0
  train:
    harm_pdb:
      dataset:
        gate_compact: true
        p_dense_zero: 0.15
  val:
    val_harm_full:
      dataset:
        gate_compact: true
log:
  tags: [harmonia, rfd4, r2, full, gate_compact, dense_zero]

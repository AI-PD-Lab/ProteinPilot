_target_: rfd3.metrics.losses.AdjacencyContactLoss
weight: 1.0

# ---------------------------------------------------------------------------
# Attractive arm: conditioned contacts (adj == 1)
# ---------------------------------------------------------------------------
# Flat-bottomed well: zero penalty for min cross-block distance in
# [min_distance, threshold]. Outside it, both arms are bounded (2*sigmoid-1).
# min_distance exists because the previous one-sided form kept attracting all the
# way to d->0 and compressed contacts to a measured 3.81 A, against the ~4.8-5.5 A
# paired beta-strands adopt -- the source of the chain breaks and CA clashes.
threshold: 6.0
softness: 2.0
min_distance: 4.5

# ---------------------------------------------------------------------------
# Which atom the distances are measured on
# ---------------------------------------------------------------------------
# The ADJ label is built on virtual C-beta with RFD1's 6 A rule
# (foundry/data/ss_adj.py::_reconstruct_cb, == RFD1 generate_Cbeta, Rosetta
# params). The loss historically measured C-ALPHA against the same 6.0 constant,
# which is a strictly tighter condition: C-beta projects ~1.5 A toward the
# contacting partner, so a pair already satisfying the label at CB=6 sits at
# CA~6.5-8 and the loss kept pulling for another 0.5-2 A.
#
# use_cb: true scores C-beta instead. RFD3 is all-atom and predicts CB as a real,
# MSE-supervised atom, so the loss uses that directly and gradient reaches the
# atom that actually determines packing. Reconstruction (RFD1's generate_Cbeta
# formula, identical constants to _reconstruct_cb) is the FALLBACK for glycine,
# where no CB exists. Requires token_bb_idx / token_bb_valid / token_cb_idx /
# token_has_cb, emitted by AddIsXFeats alongside is_ca.
#
# Preference order per token: real predicted CB -> virtual CB rebuilt from
# N/CA/C (glycine) -> CA (non-protein). This is the SAME order the analysis
# metric already uses (analyze_ss_adj_conditioning.py reads CB, falling back to
# CA), so turning it on ALIGNS loss and metric rather than diverging them -- no
# re-baseline needed.
use_cb: false

# Freeze fixed-motif coordinates inside this loss, so a designed<->target
# conditioned pair moves the binder to the target instead of dragging the pinned
# target toward the binder.
detach_motif: false

# ---------------------------------------------------------------------------
# Repulsive arm: explicit non-contacts (adj == 0). Off by default.
# ---------------------------------------------------------------------------
# Without this the loss is purely attractive -- only adj==1 pairs are scored, so
# nothing keeps explicitly-non-adjacent blocks apart and the attractive term
# biases the model toward association. Masked (2) pairs stay indeterminate: a
# block-pair rectangle must be entirely 0 to be scored.
#
# The separation floor is NATIVE-MATCHED, not a fixed threshold:
#     floor = min(native_min_dist - negative_margin, negative_threshold)
# A flat threshold would be actively harmful, because with ss_adj_loop_adj=false
# (the pn_unit / interface datasets) every loop-involved block pair is skipped by
# _adj_blocks_from_coords and left at 0 -- i.e. labelled "explicit non-contact"
# while physically packed against its neighbour. Loops are ~half of all residues,
# so "push all 0-pairs past 6-8 A" would try to peel the protein apart from
# itself. Native-matching means a loop touching at 4 A gets a 3 A floor
# (anti-clash only) while a genuinely distant pair gets the full ceiling.
negative_weight: 0.0
negative_threshold: 8.0
negative_margin: 1.0

# @package _global_
defaults:
  - base
  - _self_

_target_: rfd3.engine.RFD3InferenceEngine

out_dir: ???
inputs: ???
ckpt_path: rfd3
json_keys_subset: null
skip_existing: True

specification: {}

diffusion_batch_size: 8
n_batches: 1

inference_sampler:
  kind: "default"
  cfg_features:
    - active_donor
    - active_acceptor
    - ref_atomwise_rasa
    - ss_ratio
    - ss_labels
    - adj_matrix

  use_classifier_free_guidance: False
  cfg_t_max: null
  cfg_scale: 2.0
  center_option: "all"
  s_trans: 1.0
  inference_noise_scaling_factor: 1.0
  allow_realignment: False

  n_recycle: null

  num_timesteps: 200
  step_scale: 1.5
  noise_scale: 1.003
  p: 7
  gamma_0: 0.6
  gamma_min: 1.0
  s_jitter_origin: 0.0

cleanup_guideposts: True
cleanup_virtual_atoms: True
read_sequence_from_sequence_head: True
output_full_json: True

global_prefix: null
dump_prediction_metadata_json: True
dump_trajectories: False
align_trajectory_structures: False
prevalidate_inputs: False
low_memory_mode: False

# @package _global_
#
# Phase 1 fine-tuning experiment: ss_ratio global conditioning token.
#
# What this does:
#   - Loads a pre-trained RFD3 checkpoint
#   - Zero-initialises the single new ss_ratio embedding layer (safe warm start)
#   - Freezes the entire backbone; only the ss_ratio embedder trains
#   - Runs for 5 epochs at LR 1e-4
#   - Validation is disabled (benchmark JSON files not available locally)
#
# Usage:
#   bash models/rfd3/train.py \
#       experiment=ss_ratio_finetune \
#       ckpt_config.path=/path/to/base_checkpoint.ckpt \
#       paths/data=cluster_a_local \
#       paths.log_dir=/path/to/work/RFD3_Training/logs
#
# After Phase 1 converges, run Phase 2 by changing:
#   - parameter_freezing_config.freeze_by_default: false
#   - model.optimizer._target_: set up param groups for differential LR
#   - trainer.max_epochs: 15

name: ss-ratio-finetune-phase1
tags: [ss-ratio, finetune, phase1]

# ── Checkpoint ────────────────────────────────────────────────────────────────
ckpt_config:
  _target_: foundry.utils.weights.CheckpointConfig
  path: ???   # override on command line: ckpt_config.path=/path/to/checkpoint.ckpt
  reset_optimizer: true

  weight_loading_config:
    _target_: foundry.utils.weights.WeightLoadingConfig
    default_policy: copy
    # New params not in checkpoint: linear2 is zeroed by SSRatioEncoder.__init__,
    # reinit preserves that. linear1 gets PyTorch default (Kaiming). Both correct.
    fallback_policy: reinit

  parameter_freezing_config:
    _target_: foundry.utils.weights.ParameterFreezingConfig
    # Freeze everything by default.
    # NOTE: The EMA wrapper stores parameters under "model.*" and "shadow.*" prefixes,
    # so patterns must include "model." to match. Shadow (EMA copy) is always frozen.
    freeze_by_default: true
    param_policies:
      "model.token_initializer.ss_encoder.*": false

# ── Trainer overrides ─────────────────────────────────────────────────────────
trainer:
  # max_epochs is ABSOLUTE (not relative to checkpoint epoch).
  # Base checkpoint is epoch 570; trainer increments to 571 on load.
  # 581 = 571 + 10 → trains epochs 571-580 = 10 epochs.
  # Override on command line if resuming from a later checkpoint.
  max_epochs: 581
  n_examples_per_epoch: 2400
  validate_every_n_epochs: 99999  # effectively disabled — no local benchmark JSONs
  checkpoint_every_n_epochs: 1    # checkpoint every epoch (only 5 total)
  grad_accum_steps: 2

# ── Optimizer: higher LR since only a tiny number of params are unfrozen ──────
model:
  optimizer:
    _target_: torch.optim.Adam
    lr: 1.0e-4
    betas: [0.9, 0.95]
    eps: 1.0e-8
  lr_scheduler:
    _target_: foundry.training.schedulers.AF3Scheduler
    base_lr: 1.0e-4
    warmup_steps: 200
    decay_factor: 0.95
    decay_steps: 5000

# ── Dataset overrides ─────────────────────────────────────────────────────────
datasets:
  diffusion_batch_size_train: 16
  crop_size: 256
  max_atoms_in_crop: 2560
  global_transform_args:
    meta_conditioning_probabilities:
      add_global_is_non_loopy_feature: 0.99
      calculate_hbonds: 0.0   # hbplus binary not available locally; disable to avoid fallback retries
  train:
    pdb:
      probability: 1.0
      # pdb_base.yaml sets load_from_cache: True, but no local CIF cache exists.
      # Override both sub-datasets to parse CIF files directly from the mirror.
      sub_datasets:
        interface:
          dataset:
            cif_parser_args:
              # load_from_cache / save_to_cache both default to True when cache_dir is
              # set (see atomworks/ml/datasets/parsers/base.py:103-105). The cache_dir
              # comes from ${paths.data.cif_cache_dir} in cluster_a_local.yaml.
              # If the cache dir is empty or missing an entry, the parser falls back
              # to parsing the raw CIF and saving the result — no manual intervention needed.
              load_from_cache: true
              save_to_cache: true
        pn_unit:
          dataset:
            cif_parser_args:
              load_from_cache: true
              save_to_cache: true
  # Disable validation datasets (benchmark JSONs not available locally)
  val: null

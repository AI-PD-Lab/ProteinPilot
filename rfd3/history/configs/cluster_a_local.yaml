# Local paths for Gerstung lab cluster (barracuda / /path/to/work).
# Override the IPD-internal default.yaml paths to point at the local PDB mirror
# and the locally created train/val parquet splits.
#
# Usage: add `paths/data: cluster_a_local` to your experiment config defaults.

# CIF files from the atomworks PDB mirror
pdb_data_dir: /path/to/work/RFD3_Training/Data_Mirrors/pdb

# Train/val parquet splits created by atomworks/Shell/create_parquet_splits.sh
pdb_parquet_dir: /path/to/work/RFD3_Training/Data_Mirrors/metadata/splits

# Not available locally — disable distillation datasets for local runs
monomer_distillation_data_dir: null
monomer_distillation_parquet_dir: null

# Not available locally — validation benchmarks are skipped in the finetune config
design_benchmark_data_dir: null
design_model_weight_dir: null

# Residue cache not available locally; set to null to recompute on the fly
residue_cache_dir: null

# Local CIF parse cache — built by atomworks/Shell/build_cif_cache.sh
# When populated, load_from_cache: true gives ~2-3x faster data loading.
# Set to null to parse CIF files directly (slower but always works).
cif_cache_dir: /path/to/work/RFD3_Training/Data_Mirrors/cif_cache

# Where to log failed transform examples
failed_examples_dir: /path/to/work/RFD3_Training/logs/failed_examples

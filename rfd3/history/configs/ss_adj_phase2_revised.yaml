# @package _global_
defaults:
  - ss_adj_phase1b
  - override /callbacks: ss_adj_training
  - _self_

name: ss-adj-phase2
tags: [ss-adj, finetune, phase2, full-model]

ckpt_config:
  reset_optimizer: true
  parameter_freezing_config:
    freeze_by_default: false
    param_policies:
      "shadow.*": true

trainer:
  # Loading epoch-0621 starts at epoch 622. Epochs 622-645 provide 288,000
  # examples, 3.75x either adapter phase, with restart points every 12,000.
  max_epochs: 646
  n_examples_per_epoch: 12000
  validate_every_n_epochs: 1
  checkpoint_every_n_epochs: 1
  limit_val_batches: 64
  find_unused_parameters: false

model:
  optimizer:
    lr: 2.0e-6
  lr_scheduler:
    base_lr: 2.0e-6
    warmup_steps: 250
    decay_factor: 0.95
    decay_steps: 6000

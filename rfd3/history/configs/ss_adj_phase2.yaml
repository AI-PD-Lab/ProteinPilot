# @package _global_
defaults:
  - ss_adj_phase1
  - _self_

name: ss-adj-phase2
tags: [ss-adj, finetune, phase2]

ckpt_config:
  reset_optimizer: true
  parameter_freezing_config:
    freeze_by_default: false
    param_policies:
      "shadow.*": true

trainer:
  max_epochs: 621
  n_examples_per_epoch: 12000

model:
  optimizer:
    lr: 2.0e-6
  lr_scheduler:
    base_lr: 2.0e-6
    warmup_steps: 250
    decay_factor: 0.95
    decay_steps: 6000

# @package _global_
#
# Phase 5 (geometry): continues from epoch-0670 with ONE change -- AdjacencyContactLoss
# is now a flat-bottomed well instead of a one-sided attractor. Everything else,
# including the full motif-conditioning mixture, is carried over from Phase 4 unchanged.
#
# Why only one change. epoch-0645, trained WITHOUT the adjacency loss, produces 0.00
# chain breaks and 0.00 CA clashes on the 6-case benchmark; epoch-0670, trained WITH it,
# produces 1.29-2.93 breaks. The model does not need geometry restraints to build clean
# backbones -- it stopped doing so because the loss applied a force with no lower bound:
#   1 - sigmoid((6 - d)/softness)  ->  0.50 at 6.0 A, 0.35 at 4.8, 0.25 at 3.8, 0.12 at 2.0
# i.e. monotonic in d with its optimum at d -> 0. Measured on epoch-0670 designs, the mean
# minimum cross-block distance is 3.81 A, against the ~4.8-5.5 A that paired beta-strands
# actually adopt: contacts compressed a full Angstrom into near-clash range, straining the
# backbone into breaks. Adding continuity/clash losses would treat the symptom; removing
# the force is the fix. If breaks or clashes survive this run, a CA continuity term is the
# next thing to add -- with evidence that it is needed, and only that one.
#
# Usage: same overrides as phase4, with ckpt_config.path=<epoch-0670>.

name: ss-adj-phase5-geometry
tags: [ss-adj, finetune, phase5, geometry, contact-well]

defaults:
  - /trainer/loss/losses/adjacency_contact_loss@trainer.loss.adjacency_contact_loss
  - _self_

ckpt_config:
  _target_: foundry.utils.weights.CheckpointConfig
  path: ???
  reset_optimizer: true
  weight_loading_config:
    _target_: foundry.utils.weights.WeightLoadingConfig
    default_policy: copy
    fallback_policy: reinit
  parameter_freezing_config:
    _target_: foundry.utils.weights.ParameterFreezingConfig
    freeze_by_default: false
    param_policies:
      "shadow.*": true

trainer:
  # max_epochs is an ABSOLUTE target epoch (matches every ss_adj_phase*.yaml's
  # convention) -- epoch-0651.ckpt's current_epoch is 651, so this must be
  # 651 + (desired new epochs), not just the desired new epoch count.
  max_epochs: 685  # 670 + 15 new epochs
  n_examples_per_epoch: 9600
  validate_every_n_epochs: 99999
  checkpoint_every_n_epochs: 1
  grad_accum_steps: 1
  find_unused_parameters: false

datasets:
  # Restore the production train_conditions mixture from
  # configs/experiment/pretrain.yaml ("the ratios used in the preprint"),
  # which no local stage (ss_ratio_finetune or any ss_adj_phase*) ever applied.
  # island/tipatom are real-fixed-atom conditioning -- the training-time analog
  # of `input`+`contig` motif-scaffolding at inference (same annotations:
  # is_motif_token / is_motif_atom_with_fixed_coord). Unlike pretrain.yaml
  # (which leaves ppi=0.0, treating PPI/binder-design as a separate finetune),
  # ppi is given nonzero weight here -- our actual use case (scaffolding around
  # a real target) is exactly the PPI/binder-design task shape, so it should be
  # represented directly in this recovery mixture rather than deferred.
  global_transform_args:
    train_conditions:
      unconditional:
        frequency: 2.0
      island:
        frequency: 2.0
      sequence_design:
        frequency: 0.5
      tipatom:
        frequency: 5.0
      ppi:
        frequency: 2.0
  train:
    standard:
      sub_datasets:
        pn_unit:
          dataset:
            dataset_parser:
              _target_: atomworks.ml.datasets.parsers.TarBackedPNUnitsDFParser
              tar_path: ${paths.data.pdb_mirror_tar_path}
              index_path: ${paths.data.pdb_mirror_tar_index_path}
        interface:
          dataset:
            dataset_parser:
              _target_: atomworks.ml.datasets.parsers.TarBackedInterfacesDFParser
              tar_path: ${paths.data.pdb_mirror_tar_path}
              index_path: ${paths.data.pdb_mirror_tar_index_path}

model:
  net:
    token_initializer:
      ss_adapter:
        enabled: true
      adj_adapter:
        enabled: true
    inference_sampler:
      cfg_features:
        - ref_atomwise_rasa
        - active_donor
        - active_acceptor
        - ss_ratio
        - ss_labels
        - adj_matrix
  optimizer:
    _target_: torch.optim.Adam
    lr: 2.0e-6
    betas: [0.9, 0.95]
    eps: 1.0e-8
  lr_scheduler:
    _target_: foundry.training.schedulers.AF3Scheduler
    base_lr: 2.0e-6
    warmup_steps: 250
    decay_factor: 0.95
    decay_steps: 6000

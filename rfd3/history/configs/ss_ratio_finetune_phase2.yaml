# @package _global_
#
# Phase 2 fine-tuning: unfreeze the backbone after Phase 1 adapter-only
# training shows a measurable ss_ratio effect.

defaults:
  - ss_ratio_finetune
  - _self_

name: ss-ratio-finetune-phase2
tags: [ss-ratio, finetune, phase2]

ckpt_config:
  reset_optimizer: true
  parameter_freezing_config:
    # Unfreeze the trainable model/backbone by default, but keep the EMA shadow
    # copy frozen. EMA updates should happen through EMA.update(), not gradients.
    freeze_by_default: false
    param_policies:
      "shadow.*": true

trainer:
  # max_epochs is absolute. Loading epoch-0580 increments to 581, so 586
  # trains epochs 581-585 = 5 Phase 2 epochs.
  # With 3 GPUs and diffusion_batch_size_train=16 this is 250 optimizer
  # steps/epoch, 1250 total steps: a stronger but still conservative
  # backbone adaptation pass.
  max_epochs: 586
  n_examples_per_epoch: 12000
  validate_every_n_epochs: 99999
  checkpoint_every_n_epochs: 1
  grad_accum_steps: 1

model:
  optimizer:
    lr: 5.0e-6
  lr_scheduler:
    base_lr: 5.0e-6
    warmup_steps: 125
    decay_factor: 0.95
    decay_steps: 5000

# @package _global_
#
# Phase 4 (motif-recovery): continues from epoch-0651.ckpt (Phase 3, fixed
# AdjacencyContactLoss) and restores the production `pretrain.yaml` train_conditions
# mixture (island/tipatom fixed-atom exposure), which every prior local stage
# (ss_ratio_finetune, SS/ADJ phase1/1a/1b/2/3) silently omitted -- confirmed via
# side-by-side diff against the upstream RFD3 installation
# (/path/to/HARMONIA/rfd3/foundry) that every
# condition config file and pretrain.yaml itself are byte-identical between
# installations, so nothing needed porting; the SS/ADJ configs simply never
# composed pretrain.yaml's override in.
#
# Root cause this addresses: real-motif-scaffolding inference (`input`+`contig`)
# collapsed catastrophically on every SS/ADJ-finetuned checkpoint (epoch-0645,
# epoch-0651) despite working essentially perfectly on the pre-SS/ADJ base
# checkpoint (rfd3_latest.ckpt) -- because `island`=1.0/`tipatom`=0.0 (the
# ss_adj_design.yaml / design_base.yaml defaults) meant real-fixed-atom examples
# were ~1/8 as frequent as the production recipe intends, for the entire
# finetuning trajectory, causing catastrophic forgetting of motif placement.
#
# Usage:
#   python models/rfd3/src/rfd3/train_ss_adj.py \
#       experiment=ss_adj_phase4_motif_recovery \
#       datasets=ss_adj_design \
#       datasets.train.loop=null \
#       datasets.train.standard.probability=1.0 \
#       datasets.val=null \
#       "paths/data=cluster_b_local_ss_adj" \
#       ckpt_config.path=/path/to/epoch-0651.ckpt \
#       paths.log_dir=/path/to/logs \
#       trainer.devices_per_node=4 trainer.num_nodes=1

name: ss-adj-phase4-motif-recovery
tags: [ss-adj, finetune, phase4, motif-recovery, local-standard-only]

defaults:
  - /trainer/loss/losses/adjacency_contact_loss@trainer.loss.adjacency_contact_loss
  - _self_

ckpt_config:
  _target_: foundry.utils.weights.CheckpointConfig
  path: ???
  reset_optimizer: true
  weight_loading_config:
    _target_: foundry.utils.weights.WeightLoadingConfig
    default_policy: copy
    fallback_policy: reinit
  parameter_freezing_config:
    _target_: foundry.utils.weights.ParameterFreezingConfig
    freeze_by_default: false
    param_policies:
      "shadow.*": true

trainer:
  # max_epochs is an ABSOLUTE target epoch (matches every ss_adj_phase*.yaml's
  # convention) -- epoch-0651.ckpt's current_epoch is 651, so this must be
  # 651 + (desired new epochs), not just the desired new epoch count.
  max_epochs: 671  # 651 + 20 new epochs
  n_examples_per_epoch: 9600
  validate_every_n_epochs: 99999
  checkpoint_every_n_epochs: 1
  grad_accum_steps: 1
  find_unused_parameters: false

datasets:
  # Restore the production train_conditions mixture from
  # configs/experiment/pretrain.yaml ("the ratios used in the preprint"),
  # which no local stage (ss_ratio_finetune or any ss_adj_phase*) ever applied.
  # island/tipatom are real-fixed-atom conditioning -- the training-time analog
  # of `input`+`contig` motif-scaffolding at inference (same annotations:
  # is_motif_token / is_motif_atom_with_fixed_coord). Unlike pretrain.yaml
  # (which leaves ppi=0.0, treating PPI/binder-design as a separate finetune),
  # ppi is given nonzero weight here -- our actual use case (scaffolding around
  # a real target) is exactly the PPI/binder-design task shape, so it should be
  # represented directly in this recovery mixture rather than deferred.
  global_transform_args:
    train_conditions:
      unconditional:
        frequency: 2.0
      island:
        frequency: 2.0
      sequence_design:
        frequency: 0.5
      tipatom:
        frequency: 5.0
      ppi:
        frequency: 2.0
  train:
    standard:
      sub_datasets:
        pn_unit:
          dataset:
            dataset_parser:
              _target_: atomworks.ml.datasets.parsers.TarBackedPNUnitsDFParser
              tar_path: ${paths.data.pdb_mirror_tar_path}
              index_path: ${paths.data.pdb_mirror_tar_index_path}
        interface:
          dataset:
            dataset_parser:
              _target_: atomworks.ml.datasets.parsers.TarBackedInterfacesDFParser
              tar_path: ${paths.data.pdb_mirror_tar_path}
              index_path: ${paths.data.pdb_mirror_tar_index_path}

model:
  net:
    token_initializer:
      ss_adapter:
        enabled: true
      adj_adapter:
        enabled: true
    inference_sampler:
      cfg_features:
        - ref_atomwise_rasa
        - active_donor
        - active_acceptor
        - ss_ratio
        - ss_labels
        - adj_matrix
  optimizer:
    _target_: torch.optim.Adam
    lr: 2.0e-6
    betas: [0.9, 0.95]
    eps: 1.0e-8
  lr_scheduler:
    _target_: foundry.training.schedulers.AF3Scheduler
    base_lr: 2.0e-6
    warmup_steps: 250
    decay_factor: 0.95
    decay_steps: 6000
